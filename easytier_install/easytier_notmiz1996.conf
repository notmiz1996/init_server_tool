# EasyTier 节点配置（模板，适用于本 init_server_tool 模板的新设备）
#
# 说明：
#   - network_secret 使用占位符 {{EASYTIER_SECRET}}，
#     由 install-easytier.sh 在安装时用 ${SECRET_DIR}/easytier_secret
#     中的值替换（无则自动随机生成）。真实密钥不要提交到任何仓库。
#   - 不要写 instance_id：每台设备首次启动会自动生成唯一 ID，
#     模板复用到多台机器时写死值会导致 ID 冲突。
#   - peer 端口必须与 peers 的 listeners 一一对应：
#     本机监听 tcp/udp:11010、wg:11011 → wg peer 指向 11011。
#     如需 ws/wss peer，请先在 listeners 增加
#     "ws://0.0.0.0:11011/" 与 "wss://0.0.0.0:11012/"。

instance_name = "notmiz1996"
ipv4 = "10.144.144.251/24"
ipv6_public_addr_auto = false
dhcp = false
listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
    "wg://0.0.0.0:11011",
]

rpc_portal = "0.0.0.0:0"

[network_identity]
network_name = "notmiz1996"
network_secret = "{{EASYTIER_SECRET}}"

[[peer]]
uri = "tcp://122.51.3.236:11010"
[[peer]]
uri = "udp://122.51.3.236:11010"
[[peer]]
uri = "wg://122.51.3.236:11011"

[flags]
